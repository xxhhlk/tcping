name: GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to publish. Leave empty to use the VERSION from Makefile.
        required: false
        default: ""
      release_name:
        description: Release title. Leave empty to use the tag name.
        required: false
        default: ""
      prerelease:
        description: Mark the release as a prerelease.
        required: false
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          version="$(sed -n 's/^VERSION := //p' Makefile | head -n 1)"
          tag_name="${{ inputs.tag_name }}"
          release_name="${{ inputs.release_name }}"

          if [ -z "$tag_name" ]; then
            tag_name="v${version}"
          fi

          if [ -z "$release_name" ]; then
            release_name="$tag_name"
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: make release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            output/*.tar.gz
            output/*.zip
            output/*.deb
