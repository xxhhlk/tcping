name: Lint
on:
  workflow_dispatch:

jobs:
  lint:
    name: Lint -- Revive
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v6

      - name: Run Revive Action
        uses: morphy2k/revive-action@v2.7.8
        with:
          config: revive.toml
